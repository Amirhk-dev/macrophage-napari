name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check napari_macrophage/ tests/

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs deps
        # autodoc_mock_imports covers napari/qtpy/onnxruntime/torch, but our
        # modules import numpy/scipy/skimage/tifffile/zarr/magicgui at load
        # time, so those need to be real. --no-deps then avoids pulling
        # napari[all] (Qt/vispy) which is unnecessary for doc generation.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sphinx>=7" furo myst-parser
          python -m pip install numpy scipy scikit-image tifffile zarr magicgui
          python -m pip install --no-deps -e .
      - name: Build docs (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Qt/OpenGL libraries
        # napari + qtpy need these to import successfully in a headless CI runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-cursor0

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        # xvfb-run gives Qt a virtual display so widget-touching tests don't crash.
        run: xvfb-run -a python -m pytest tests/ -v
